openapi: 3.0.3
info:
  title: "Latch: Secure API and PostgreSQL Backend Foundation"
  version: "1.0.0"
  description: >
    A security-first REST API built directly on PostgreSQL, demonstrating
    explicit boundaries, parameterized SQL, RBAC, session management, and ACID transactions.
servers:
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session bearer token
    cookieAuth:
      type: apiKey
      in: cookie
      name: latch_session
      description: HttpOnly session cookie

  schemas:
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: The request contains invalid fields.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            requestId:
              type: string
              example: req_7b82f0e7-cc6c-4f86-b5bd-d9cc6406eeca

    User:
      type: object
      required:
        - id
        - email
        - display_name
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        status:
          type: string
          enum: [active, suspended, deactivated]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Workspace:
      type: object
      required:
        - id
        - name
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkspaceMember:
      type: object
      required:
        - id
        - workspace_id
        - user_id
        - role
        - email
        - display_name
        - created_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, member, viewer]
        email:
          type: string
        display_name:
          type: string
        created_at:
          type: string
          format: date-time

    Task:
      type: object
      required:
        - id
        - workspace_id
        - owner_id
        - title
        - status
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [todo, in_progress, done]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    AuditEvent:
      type: object
      required:
        - id
        - action
        - resource_type
        - resource_id
        - metadata
        - created_at
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
          nullable: true
        workspace_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time

paths:
  /health/liveness:
    get:
      summary: Process Liveness Check
      responses:
        200:
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptimeSeconds:
                    type: integer
                  timestamp:
                    type: string

  /health/readiness:
    get:
      summary: Service Readiness Probe
      responses:
        200:
          description: PostgreSQL database is connected and ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  database:
                    type: string
                    example: connected
                  timestamp:
                    type: string
        503:
          description: Database disconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/auth/register:
    post:
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - displayName
                - password
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  sessionToken:
                    type: string
                  expiresAt:
                    type: string
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        409:
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/auth/login:
    post:
      summary: Authenticate user and establish session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        200:
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  sessionToken:
                    type: string
                  expiresAt:
                    type: string
        401:
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/auth/logout:
    post:
      summary: Invalidate current session
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        200:
          description: Session invalidated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/v1/me:
    get:
      summary: Retrieve current authenticated user profile
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        200:
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/workspaces:
    get:
      summary: List workspaces accessible by current user
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        200:
          description: List of workspaces
    post:
      summary: Create a new workspace
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        201:
          description: Workspace created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    $ref: '#/components/schemas/Workspace'

  /api/v1/tasks:
    get:
      summary: List authorized tasks with filtering, pagination, and sorting
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: workspaceId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [todo, in_progress, done]
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [createdAt, updatedAt, title, status]
            default: createdAt
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        200:
          description: Filtered tasks list
    post:
      summary: Create a new task within a workspace (Owner/Member only)
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - workspaceId
                - title
              properties:
                workspaceId:
                  type: string
                  format: uuid
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [todo, in_progress, done]
                  default: todo
      responses:
        201:
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
        403:
          description: Viewers cannot create tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/tasks/{taskId}:
    get:
      summary: Retrieve task detail
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Task details
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
        404:
          description: Task not found or caller not in workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      summary: Update task with Optimistic Concurrency Control (Owner/Member only)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [todo, in_progress, done]
                version:
                  type: integer
                  minimum: 1
      responses:
        200:
          description: Task updated (version incremented)
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
        409:
          description: Optimistic locking version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      summary: Soft-delete task (Owner or Task Creator only)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Task deleted successfully
        403:
          description: Forbidden to delete this task
        404:
          description: Task not found

